    function CustomCursor({ cursorState, cursorText }) {
      const [pos, setPos] = useState({ x: -100, y: -100 });
      const [isVisible, setIsVisible] = useState(false);

      useEffect(() => {
        const handleMouseMove = (e) => {
          setPos({ x: e.clientX, y: e.clientY });
          if (!isVisible) setIsVisible(true);
        };
        const handleMouseLeave = () => setIsVisible(false);

        window.addEventListener('mousemove', handleMouseMove);
        document.body.addEventListener('mouseleave', handleMouseLeave);
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          document.body.removeEventListener('mouseleave', handleMouseLeave);
        };
      }, [isVisible]);

      if (!isVisible) return null;

      const isBig = cursorState === 'HOVER_PROJECT' || cursorState === 'PLAY';

      return (
        <div 
          className="fixed top-0 left-0 pointer-events-none z-50 transition-transform duration-75 ease-out hidden lg:block"
          style={{
            transform: `translate3d(${pos.x}px, ${pos.y}px, 0)`,
          }}
        >
          {isBig ? (
            <div className="-translate-x-1/2 -translate-y-1/2 w-24 h-24 rounded-full bg-slate-900/80 backdrop-blur-md border border-brand-appleBlue/50 flex items-center justify-center text-xs font-mono tracking-widest text-brand-appleBlue shadow-2xl transition-all duration-300 scale-100 animate-pulse">
              <span className="font-semibold text-center leading-tight px-2">{cursorText || 'WATCH'}</span>
            </div>
          ) : (
            <div className="-translate-x-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-brand-appleBlue/90 backdrop-blur-sm shadow-[0_0_15px_rgba(56,189,248,0.8)] border border-white/60 transition-all duration-150"></div>
          )}
        </div>
      );
    }

          <div className="max-w-6xl mx-auto">
            
            <div className="flex flex-col md:flex-row md:items-end justify-between mb-16 gap-6">
              <div>
                <span className="text-xs font-mono tracking-widest text-brand-appleBlue uppercase block mb-2">
                  SOFTWARE & CREATIVE ECOSYSTEM
                </span>
                <h2 className="text-3xl sm:text-5xl font-bold tracking-tight text-gradient-silver">
                  The Tools Behind the Story.
                </h2>
              </div>
              <p className="text-slate-400 max-w-md text-sm font-light">
                Perangkat lunak profesional yang digunakan tanpa persentase artifisial. Fokus pada hasil karya visual.
              </p>
            </div>

            {/* Video Editing Software */}
            <div className="mb-12">
              <h3 className="text-xs font-mono tracking-widest text-slate-400 uppercase mb-6 flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-brand-appleBlue"></span>
                VIDEO EDITING & COLOR SOFTWARE
              </h3>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                {PORTFOLIO_DATA.tools.video.map((tool) => (
                  <div 
                    key={tool.name}
                    className="glass-card p-6 rounded-2xl flex flex-col justify-between group"
                    onMouseEnter={() => setCursorState('HOVER_LINK')}
                    onMouseLeave={() => setCursorState('DEFAULT')}
                  >
                    <div className="w-10 h-10 rounded-xl bg-brand-navySlate border border-white/10 flex items-center justify-center text-brand-appleBlue mb-4 group-hover:scale-110 transition-transform">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    </div>
                    <div>
                      <h4 className="text-base font-bold text-white group-hover:text-brand-appleBlue transition-colors">
                        {tool.name}
                      </h4>
                      <p className="text-xs text-slate-400 mt-1 font-light">
                        {tool.desc}
                      </p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Graphic Design Software */}
            <div className="mb-12">
              <h3 className="text-xs font-mono tracking-widest text-slate-400 uppercase mb-6 flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-purple-400"></span>
                DESIGN & VISUAL CREATION
              </h3>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                {PORTFOLIO_DATA.tools.design.map((tool) => (
                  <div 
                    key={tool.name}
                    className="glass-card p-6 rounded-2xl flex flex-col justify-between group"
                    onMouseEnter={() => setCursorState('HOVER_LINK')}
                    onMouseLeave={() => setCursorState('DEFAULT')}
                  >
                    <div className="w-10 h-10 rounded-xl bg-brand-navySlate border border-white/10 flex items-center justify-center text-purple-400 mb-4 group-hover:scale-110 transition-transform">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>

                    <div>
                      <h4 className="text-base font-bold text-white group-hover:text-purple-400 transition-colors">
                        {tool.name}

                      <p className="text-xs text-slate-400 mt-1 font-light">
                        {tool.desc}
                      </p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* AI Assistant Workflow */}
            <div>
              <div className="flex items-center gap-3 mb-6">
                <h3 className="text-xs font-mono tracking-widest text-slate-400 uppercase">
                  AI-ASSISTED CREATIVE WORKFLOW
                </h3>
                <span className="glass-pill px-2.5 py-0.5 rounded text-[10px] font-mono text-brand-appleBlue">
                  IDEATION & RESEARCH
                </span>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {PORTFOLIO_DATA.tools.ai.map((aiTool) => (
                  <div 
                    key={aiTool.name}
                    className="glass-panel p-6 rounded-3xl border border-white/15 relative overflow-hidden group"
                  >
                    <div className="flex items-start justify-between mb-4">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl bg-brand-appleBlue/20 border border-brand-appleBlue/30 flex items-center justify-center text-brand-appleBlue">
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        </div>
                        <div>
                          <h4 className="text-xl font-bold text-white">{aiTool.name}</h4>
                          <span className="text-xs font-mono text-slate-400">{aiTool.tag}</span>

                      <div className="glass-pill px-3 py-1 rounded-full text-xs font-mono text-brand-appleBlue">
                        {aiTool.tooltip}

                    <p className="text-xs sm:text-sm text-slate-300 font-light mb-4">
                      {aiTool.uses}

                    <div className="text-[11px] font-mono text-slate-400 border-t border-white/10 pt-3">

          </div>

      );
    }

    function ContactSection({ setCursorState }) {
      const [copied, setCopied] = useState(false);

      const handleCopyEmail = () => {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = PORTFOLIO_DATA.personal.contact.email;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          setCopied(true);
          setTimeout(() => setCopied(false), 3000);
        } catch (err) {
          console.error("Copy error:", err);
        }
      };

      return (
        <section id="contact" className="py-28 px-4 sm:px-8 relative overflow-hidden border-t border-white/10 bg-slate-950">
          
          {/* Ambient Glow */}
          <div className="absolute bottom-0 left-1/2 -translate-x-1/2 w-[750px] h-[450px] bg-brand-accentBlue/15 rounded-full blur-[180px] pointer-events-none"></div>

          <div className="max-w-5xl mx-auto text-center relative z-10">
            
            <span className="text-xs font-mono tracking-widest text-brand-appleBlue uppercase block mb-4">
              START A CONVERSATION
            </span>

            <h2 className="text-4xl sm:text-6xl md:text-7xl font-bold tracking-tight text-gradient-silver mb-6">
              Have a story worth telling?
            </h2>

            <p className="text-lg sm:text-xl text-slate-300 max-w-xl mx-auto font-light mb-12">
              Mari ubah footage mentah Anda menjadi tayangan sinematik yang berkesan bagi audiens.
            </p>

            {/* Email CTA Buttons */}
            <div className="flex flex-col sm:flex-row items-center justify-center gap-4 mb-16">
              <a
                href={`mailto:${PORTFOLIO_DATA.personal.contact.email}`}
                className="w-full sm:w-auto px-10 py-5 rounded-full bg-brand-appleBlue text-brand-navyDark font-bold text-base hover:bg-white transition-all duration-300 shadow-2xl hover:shadow-brand-appleBlue/40 flex items-center justify-center gap-3"
                onMouseEnter={() => setCursorState('HOVER_LINK')}
                onMouseLeave={() => setCursorState('DEFAULT')}
              >
                <span>Start a Project</span>
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
              </a>

              <button
                onClick={handleCopyEmail}
                className="w-full sm:w-auto px-8 py-5 rounded-full glass-card text-white text-sm font-mono tracking-wider hover:bg-white/10 transition-all flex items-center justify-center gap-2"
                onMouseEnter={() => setCursorState('HOVER_LINK')}
                onMouseLeave={() => setCursorState('DEFAULT')}
              >
                <span>{copied ? '✓ Email Copied!' : PORTFOLIO_DATA.personal.contact.email}</span>
              </button>
            </div>

            {/* Contact Details */}
            <div className="flex flex-wrap items-center justify-center gap-8 text-sm font-mono text-slate-300 pt-8 border-t border-white/10">
              <a 
                href={`https://wa.me/${PORTFOLIO_DATA.personal.contact.whatsapp}`} 
                target="_blank" 
                rel="noreferrer"
                className="hover:text-brand-appleBlue transition-colors flex items-center gap-2"
              >
                <span>WhatsApp: {PORTFOLIO_DATA.personal.contact.whatsappFormatted}</span>
              </a>

              <a 
                href={PORTFOLIO_DATA.personal.contact.instagramUrl} 
                target="_blank" 
                rel="noreferrer"
                className="hover:text-brand-appleBlue transition-colors flex items-center gap-2"
              >
                <span>Instagram: {PORTFOLIO_DATA.personal.contact.instagram}</span>
              </a>

              <span className="text-slate-400">
                {PORTFOLIO_DATA.personal.location}
              </span>
            </div>

            {/* Copyright */}
            <div className="mt-16 text-xs font-mono text-slate-400">
              © {PORTFOLIO_DATA.personal.yearsActive} ANGGA OKTAVIANTO. Video Editor & Filmmaking Specialist.
            </div>

          </div>
        </section>
      );
    }

    function App() {
      const [cursorState, setCursorState] = useState('DEFAULT');
      const [cursorText, setCursorText] = useState('');
      const [selectedProject, setSelectedProject] = useState(null);
      const [showreelModalOpen, setShowreelModalOpen] = useState(false);

      const handleSetCursor = (state, text = '') => {
        setCursorState(state);
        setCursorText(text);
      };

      return (
        <div className="min-h-screen bg-brand-navyDark text-brand-softOffwhite">
          
          {/* Custom Desktop Glass Cursor */}
          <CustomCursor cursorState={cursorState} cursorText={cursorText} />

          {/* Navigation */}
          <Navigation 
            setCursorState={handleSetCursor} 
          />

          {/* Hero Section */}
          <HeroSection 
            setCursorState={handleSetCursor}
            onPlayShowreel={() => setShowreelModalOpen(true)}
          />

          {/* Experience Section */}
          <ExperienceSection 
            setCursorState={handleSetCursor}
          />

          {/* Selected Works 6 Projects Grid */}
          <SelectedWorksSection 
            setCursorState={handleSetCursor}
            onSelectProject={(proj) => setSelectedProject(proj)}
          />

          {/* About Section with Photo */}
          <AboutSection 
            setCursorState={handleSetCursor}
          />

          {/* Services */}
          <ServicesSection 
            setCursorState={handleSetCursor}
          />

          {/* Software Tools */}
          <ToolsSection 
            setCursorState={handleSetCursor}
          />

          {/* Contact Section */}
          <ContactSection 
            setCursorState={handleSetCursor}
          />

          {/* Selected Project Fullscreen Modal */}
          {selectedProject && (
            <ProjectDetailModal 
              project={selectedProject}
              onClose={() => setSelectedProject(null)}
              setCursorState={handleSetCursor}
            />
          )}

          {/* Showreel Video Modal */}
          {showreelModalOpen && (
            <ProjectDetailModal 
              project={{
                title: "SELECTED SHOWREEL 2023-2026",
                category: "Showreel Montage",
                client: "Angga Oktavianto Portfolio",
                year: "2023 — 2026",
                role: "Lead Editor & Storyteller",
                services: "Pacing · Motion · Sound Design · Color Atmosphere",
                videoType: "mp4",
                videoUrl: PORTFOLIO_DATA.showreel.videoSrc,
                thumbnail: PORTFOLIO_DATA.showreel.poster,
                description: PORTFOLIO_DATA.showreel.subtitle,
                keyPoints: [
                  "Kompilasi karya terbaik pilihan dari film pendek, dokumenter, hingga konten YouTube",
                  "Sinkronisasi audio-visual presisi dan penyusunan transisi dinamis",
                  "Eksperimen warna dan ritme potongan bingkai demi bingkai"
                ]
              }}
              onClose={() => setShowreelModalOpen(false)}
              setCursorState={handleSetCursor}
            />
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
